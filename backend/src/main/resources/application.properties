server.port=8080
server.servlet.context-path=/api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/howards_council?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:howards_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:HowardsDB@2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:howards-council-media}
aws.access-key=${AWS_ACCESS_KEY:YOUR_KEY}
aws.secret-key=${AWS_SECRET_KEY:YOUR_SECRET}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
jwt.secret=${JWT_SECRET:HowardsCouncilSecretKey2024SuperLongSecretKeyForJWTSigning}
jwt.expiration=86400000
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:Howard@Admin2024}
logging.level.com.howardscouncil=DEBUG
management.endpoints.web.exposure.include=health
